<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card for Maurya</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            transition: 0.3s;
            overflow: hidden;
            text-align: center;
            padding-bottom: 20px;
        }
        .card:hover {
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.3);
        }
        .image-container {
            width: 100%;
            height: 250px;
            background-color: #ddd; /* Placeholder color */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures image covers area without stretching */
        }
        .container {
            padding: 10px 20px;
        }
        h2 {
            color: #333;
            margin: 15px 0 5px 0;
        }
        p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="image-container">
        <!-- Ensure maurya.jpg is in the same folder -->
        <img src="maurya.jpg" alt="Maurya">
    </div>
    <div class="container">
        <h2>To My Little Brother</h2>
        <p>Happy Moments with Maurya! You are the best brother ever. Keep shining.</p>
    </div>
</div>

</body>
</html>
